<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F6FA" />
    <!-- The app commits to a light palette. `only light` opts out of Chrome's
         Auto Dark Theme and the Dark Reader lock opts out of that extension —
         both would otherwise invert the CSS but not the WebGL background,
         leaving white text on a light field. -->
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap"
      rel="stylesheet"
    />
    <title>Twinstate: every pill, drink and dose, checked together</title>

    <!-- Discovery + link previews. This is a client-rendered SPA, so a crawler
         that doesn't run JavaScript sees ONLY what is in this <head> — without
         these tags a pasted link renders as a blank card in Slack/WhatsApp/X
         and search engines index an empty page.

         NOTE: og:image and og:url must be ABSOLUTE for social scrapers.
         If the site is deployed anywhere other than the URL below, update
         SITE_ORIGIN in the three places it appears here. -->
    <meta
      name="description"
      content="Twinstate checks what you log (prescriptions, painkillers, energy drinks, supplements) against known interactions, shows where it adds up on a 3D body, and tells you what to ask a pharmacist. An educational tool, not a medical device."
    />
    <link rel="canonical" href="https://twinstate.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/og-image.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Twinstate" />
    <meta property="og:title" content="Twinstate: every pill, drink and dose, checked together" />
    <meta
      property="og:description"
      content="Log what you take. Twinstate checks the combination, shows where it adds up, and links the evidence behind every flag."
    />
    <meta property="og:url" content="https://twinstate.vercel.app/" />
    <meta property="og:image" content="https://twinstate.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Twinstate: every pill, drink and dose, checked together." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Twinstate: every pill, drink and dose, checked together" />
    <meta
      name="twitter:description"
      content="Log what you take. Twinstate checks the combination, shows where it adds up, and links the evidence behind every flag."
    />
    <meta name="twitter:image" content="https://twinstate.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
